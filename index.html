  if(nu<0){var pv=sib(-1);if(pv){startEnd=true;go("r-"+pv.id)}else toast("First page");return}
  u=nu;draw();saveProg();
}
function tapZone(side){var d=cfg.dir==="rtl"?-side:side;if(cfg.swap)d=-d;step(d)}
function draw(){
  var hid=rd.classList.contains("hide");rd.textContent="";rd.className=(cfg.fit==="width"?"fw ":"")+(cfg.mode==="double"?"dbl ":"")+(hid?"hide":"");
  var top=h("div",{class:"bar top"},h("button",{onclick:function(){go("s-"+chap.sid)}},"‹ Back"),h("div",{class:"ttl",text:"Ch. "+chap.n+(chap.title?" · "+chap.title:"")}),h("button",{onclick:settings},"⚙"));
  var lab=h("span"),bot=h("div",{class:"bar bot"},h("button",{onclick:function(){tapZone(-1)}},"◀"),lab,h("button",{onclick:function(){tapZone(1)}},"▶"));
  if(cfg.mode==="scroll"){
    var sc=h("div",{class:"scr",onclick:function(){rd.classList.toggle("hide")}});
    pages.forEach(function(p){sc.appendChild(h("img",{src:p,loading:"lazy",alt:""}))});
    var nx=sib(1);sc.appendChild(h("div",{class:"row",style:"justify-content:center;padding:20px"},nx?h("button",{class:"btn",onclick:function(e){e.stopPropagation();go("r-"+nx.id)}},"Next chapter ›"):h("span",{class:"muted",text:"End of available chapters"})));
    rd.appendChild(sc);bot.style.display="none";
  }else{
    var pg=h("div",{class:"pg"+(cfg.dir==="rtl"?" rtl":"")});
    units[u].forEach(function(i){pg.appendChild(h("img",{src:pages[i],alt:""}))});rd.appendChild(pg);
    rd.appendChild(h("div",{class:"tz",style:"left:0;width:35%",onclick:function(){tapZone(-1)}}));
    rd.appendChild(h("div",{class:"tz",style:"right:0;width:35%",onclick:function(){tapZone(1)}}));
    rd.appendChild(h("div",{class:"tz",style:"left:35%;width:30%",onclick:function(){rd.classList.toggle("hide")}}));
    lab.textContent=units[u].map(function(i){return i+1}).join("-")+" / "+pages.length;
    [u+1,u+2].forEach(function(k){if(units[k])units[k].forEach(function(i){(new Image()).src=pages[i]})});
  }
  rd.appendChild(top);rd.appendChild(bot);
}
function settings(){
  var m;
  function seg(label,k,opts){var w=h("div",{class:"seg"});
    opts.forEach(function(o){w.appendChild(h("button",{class:cfg[k]===o[0]?"on":"",text:o[1],onclick:function(){
      cfg[k]=o[0];save();if(k==="mode"||k==="cover"){buildUnits();u=Math.min(u,units.length-1)}m.remove();draw();settings()}}))});
    return [h("label",{text:label}),w]}
  m=modal([h("h3",{text:"Reader settings"}),
    seg("Page layout","mode",[["single","Single"],["double","Double spread"],["scroll","Vertical scroll"]]),
    seg("Reading direction","dir",[["rtl","Right to left"],["ltr","Left to right"]]),
    seg("Tap zones","swap",[[false,"Normal"],[true,"Swapped"]]),
    seg("Fit","fit",[["page","Fit page"],["width","Fit width"]]),
    seg("Spreads: first page","cover",[[true,"Alone"],[false,"Paired"]]),
    h("div",{class:"row"},h("button",{class:"btn",onclick:function(){m.remove()}},"Done"))]);
  m.style.zIndex=60;
}
document.addEventListener("keydown",function(e){if(e.key==="Escape"){var ms=document.querySelectorAll(".modal");if(ms.length){ms[ms.length-1].remove();e.stopImmediatePropagation()}}});
setTimeout(function(){var seen="";try{seen=localStorage.getItem("ms-ver")||""}catch(e){}
  if(seen!==VERSION){var t=h("div",{class:"toast",style:"cursor:pointer",onclick:function(){t.remove();whatsNew()}},"✨ What's new in v"+VERSION+" — tap to see");document.body.appendChild(t);setTimeout(function(){t.remove()},8000)}},2500);
start();
})();
</script>
